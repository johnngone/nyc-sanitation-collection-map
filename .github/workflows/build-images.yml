name: Build Sanitation Collection Map Container

on:
  push:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:

concurrency:
  # Avoid overlapping full image verification and release publication runs.
  group: sanitation-container-publish
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/nyc-sanitation-collection-map

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test and refresh dependencies
        run: python -m pip install -e ".[test,refresh]"

      - name: Prepare writable runtime data directory
        run: mkdir -p data

      - name: Run full Python test suite
        run: python -m pytest

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend test suite
        run: npm test
        working-directory: frontend

      - name: Build app image for verification
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: nyc-sanitation-map:ci
      - name: Smoke-test standalone image
        shell: bash
        run: |
          set -euo pipefail
          smoke_data="$(mktemp -d)"
          fixture_json="${RUNNER_TEMP}/smoke-fixture.json"
          health_json="${RUNNER_TEMP}/smoke-health.json"
          map_json="${RUNNER_TEMP}/smoke-map-config.json"
          tile_headers="${smoke_data}/tile.headers"
          tile_body="${smoke_data}/tile.pbf"
          cleanup() { docker logs nyc-sanitation-map-publish-test 2>&1 || true; docker rm -f nyc-sanitation-map-publish-test >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          docker run -d --name nyc-sanitation-map-publish-test \
            -e APP_ENV=production \
            -e DATA_REFRESH_ENABLED=false \
            -p 18080:8000 \
            -v "${smoke_data}:/app/data" \
            nyc-sanitation-map:ci
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:18080/api/live >/dev/null && break
            sleep 1
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/)" = "200"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/api/live)" = "200"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/api/health)" = "503"
          test "$(curl --silent http://127.0.0.1:18080/api/map-config | python3 -c 'import json,sys; print(str(json.load(sys.stdin)["available"]).lower())')" = "false"
          for path in /api/refuse-streets /api/app-config /docs /redoc /openapi.json /api/tiles/unpublished/11/0/0.pbf; do
            test "$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:18080${path}")" = "404"
          done
          test -z "$(find "${smoke_data}" -mindepth 1 -print -quit)"
          docker rm -f nyc-sanitation-map-publish-test >/dev/null

          docker run --rm --entrypoint python \
            -v "${smoke_data}:/smoke-data" \
            nyc-sanitation-map:ci \
            scripts/build_smoke_release.py --data-dir /smoke-data >"${fixture_json}"
          docker run --rm --entrypoint python -v "${smoke_data}:/smoke-data:ro" nyc-sanitation-map:ci -c \
            'import json,sqlite3,pathlib; f=json.load(open("/smoke-data/data_manifest.json")); d=pathlib.Path("/smoke-data")/f["release_path"]/"app.sqlite3"; c=sqlite3.connect(d); cols={r[1] for r in c.execute("pragma table_info(block_faces)")}; tables={r[0] for r in c.execute("select name from sqlite_master where type in (?,?)",("table","view"))}; assert cols=={"block_face_id","origin_block_face_id","segment_id","borough","street_name","side","geometry_wkt"}; assert not {"lookup_cache","block_face_rtree_map","block_faces_rtree"}&tables; assert dict(c.execute("select key,value from dataset_metadata"))["database_schema_revision"]=="1"'

          docker run -d --name nyc-sanitation-map-publish-test \
            -e APP_ENV=production \
            -e DATA_REFRESH_ENABLED=false \
            -p 18080:8000 \
            -v "${smoke_data}:/app/data" \
            nyc-sanitation-map:ci

          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:18080/ >"${RUNNER_TEMP}/frontend.html" \
              && curl --fail --silent --show-error http://127.0.0.1:18080/api/health >"${health_json}"; then
              ready=1
              break
            fi
            sleep 2
          done
          test "${ready}" -eq 1

          curl --fail --silent --show-error \
            http://127.0.0.1:18080/api/map-config >"${map_json}"
          python3 - "${health_json}" "${map_json}" "${fixture_json}" <<'PY'
          import json
          import math
          import sys

          health = json.load(open(sys.argv[1], encoding="utf-8"))
          config = json.load(open(sys.argv[2], encoding="utf-8"))
          fixture = json.load(open(sys.argv[3], encoding="utf-8"))
          assert health["status"] == "ok"
          assert health["environment"] == "production"
          assert health["data_manifest"] == 4
          assert health["map_available"] is True
          assert health["artifact_integrity"] == "verified"
          assert health["dataset_version"] == fixture["version"]
          assert config["available"] is True
          assert config["version"] == fixture["version"]
          assert config["tile_schema_revision"] == 4
          assert config["source_layer"] == "collection_streets"
          assert config["unknown_source_layer"] == "collection_unknowns"
          bounds = config["bounds"]
          assert isinstance(bounds, list) and len(bounds) == 4
          assert all(isinstance(value, (int, float)) and math.isfinite(value) for value in bounds)
          assert bounds[0] < bounds[2] and bounds[1] < bounds[3]
          assert bounds == fixture["bounds"]
          PY

          tile_url="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["tile_url"])' "${fixture_json}")"
          curl --fail --silent --show-error \
            --dump-header "${tile_headers}" \
            --output "${tile_body}" \
            "http://127.0.0.1:18080${tile_url}"
          etag="$(python3 - "${tile_headers}" "${tile_body}" <<'PY'
          import pathlib
          import sys

          headers = {}
          for line in pathlib.Path(sys.argv[1]).read_text(encoding="iso-8859-1").splitlines()[1:]:
              if ":" in line:
                  name, value = line.split(":", 1)
                  headers[name.strip().lower()] = value.strip()
          body = pathlib.Path(sys.argv[2]).read_bytes()
          assert body.startswith(b"\x1f\x8b")
          assert headers["content-encoding"].lower() == "gzip"
          assert headers["content-type"].startswith("application/vnd.mapbox-vector-tile")
          assert headers["cache-control"] == "public, max-age=31536000, immutable"
          assert headers["etag"]
          print(headers["etag"])
          PY
          )"
          docker run --rm --entrypoint python \
            -v "${smoke_data}:/smoke-data:ro" \
            nyc-sanitation-map:ci \
            -c 'import gzip, pathlib, mapbox_vector_tile as m; payload=gzip.decompress(pathlib.Path("/smoke-data/tile.pbf").read_bytes()); decoded=m.decode(payload); assert decoded["collection_streets"]["features"]'
          cache_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H "If-None-Match: ${etag}" "http://127.0.0.1:18080${tile_url}")"
          test "${cache_status}" = "304"

      - name: Set up QEMU for ARM64 builds
        if: github.event_name == 'release'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        if: github.event_name == 'release'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'release'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare release image tags
        id: release-tags
        if: github.event_name == 'release'
        shell: bash
        env:
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          {
            echo 'tags<<EOF'
            echo "${IMAGE}:${RELEASE_TAG}"
            if [[ "${IS_PRERELEASE}" == "false" ]]; then
              echo "${IMAGE}:latest"
            fi
            echo 'EOF'
          } >>"${GITHUB_OUTPUT}"

      - name: Publish AMD64 and ARM64 release image
        if: github.event_name == 'release'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.release-tags.outputs.tags }}

      - name: Verify published image platforms
        if: github.event_name == 'release'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          inspect_output="$(docker buildx imagetools inspect "${IMAGE}:${RELEASE_TAG}")"
          printf '%s\n' "${inspect_output}"
          grep -Eq 'Platform:[[:space:]]+linux/amd64' <<<"${inspect_output}"
          grep -Eq 'Platform:[[:space:]]+linux/arm64' <<<"${inspect_output}"
