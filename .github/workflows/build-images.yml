name: Build NYC Trash Map Container

on:
  release:
    types:
      - published
  workflow_dispatch:

concurrency:
  group: nyc-trash-map-container-publish
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/nyc-trash-map

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test and refresh dependencies
        run: python -m pip install -e ".[test,refresh]"
      - name: Prepare writable runtime data directory
        run: mkdir -p data
      - name: Run full Python test suite
        run: python -m pytest
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Run frontend test suite
        run: npm test
        working-directory: frontend
      - name: Build app image for verification
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: nyc-trash-map:ci
      - name: Smoke-test standalone image
        run: bash scripts/smoke_container.sh nyc-trash-map:ci nyc-trash-map-publish-test
      - name: Set up QEMU for ARM64 builds
        if: github.event_name == 'release'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        if: github.event_name == 'release'
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event_name == 'release'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare release image tags
        id: release-tags
        if: github.event_name == 'release'
        shell: bash
        env:
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          {
            echo "version=${RELEASE_TAG#v}"
            echo 'tags<<EOF'
            echo "${IMAGE}:${RELEASE_TAG}"
            if [[ "${IS_PRERELEASE}" == "false" ]]; then
              echo "${IMAGE}:latest"
            fi
            echo 'EOF'
          } >>"${GITHUB_OUTPUT}"
      - name: Publish AMD64 and ARM64 release image
        if: github.event_name == 'release'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.release-tags.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.release-tags.outputs.version }}
      - name: Verify published image platforms
        if: github.event_name == 'release'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          inspect_output="$(docker buildx imagetools inspect "${IMAGE}:${RELEASE_TAG}")"
          printf '%s\n' "${inspect_output}"
          grep -Eq 'Platform:[[:space:]]+linux/amd64' <<<"${inspect_output}"
          grep -Eq 'Platform:[[:space:]]+linux/arm64' <<<"${inspect_output}"
