services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DATABASE_PATH: /app/data/app.sqlite3
      DATA_MANIFEST_PATH: /app/data/data_manifest.json
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  refresh:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "scripts/run_scheduler.py"]
    environment:
      DATA_REFRESH_ENABLED: ${DATA_REFRESH_ENABLED:-true}
      DATA_REFRESH_INTERVAL_DAYS: ${DATA_REFRESH_INTERVAL_DAYS:-14}
      DATA_REFRESH_ON_STARTUP: ${DATA_REFRESH_ON_STARTUP:-false}
      DATABASE_PATH: /app/data/app.sqlite3
      DATA_MANIFEST_PATH: /app/data/data_manifest.json
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ""
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
