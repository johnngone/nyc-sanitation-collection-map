services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_HOST_PORT:-8080}:8000"
    environment:
      DATABASE_PATH: /app/data/app.sqlite3
      DATA_MANIFEST_PATH: /app/data/data_manifest.json
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

